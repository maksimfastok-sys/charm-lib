name: Build Native Library

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Download ImGui
      run: |
        git clone https://github.com/ocornut/imgui.git imgui
        cp imgui/backends/imgui_impl_android.* imgui/
        cp imgui/backends/imgui_impl_opengl3.* imgui/

    - name: Compile .so
      run: |
        mkdir -p jniLibs/arm64-v8a
        $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++ -DIMGUI_IMPL_OPENGL_ES3 -static-libstdc++ -shared -llog -lGLESv3 -landroid -Iimgui -o jniLibs/arm64-v8a/libcharmdev.so charmdev.cpp imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp imgui/imgui_impl_opengl3.cpp imgui/imgui_impl_android.cpp

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-so
        path: jniLibs/arm64-v8a/libcharmdev.so
