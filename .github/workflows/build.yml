name: Build Native Library

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Compile .so
      run: |
        mkdir -p jniLibs/arm64-v8a
        $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++ -shared -o jniLibs/arm64-v8a/libcharmdev.so charmdev.cpp

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-so
        path: jniLibs/arm64-v8a/libcharmdev.so
